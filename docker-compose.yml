version: "3.8"

services:
  mudademote:
    build: .
    container_name: mudademote_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./presets.json:/app/presets.json
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PRESET=Example
      - AUTOSTART=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

